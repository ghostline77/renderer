[package]
name = "ghostline-renderer"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Native asset preview rendering for Cyberpunk 2077"

[dependencies]
ghostline-red = { git = "https://github.com/ghostline77/ghostline-red" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
wgpu = { version = "28", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "wgsl"] }

[build-dependencies]
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[profile.release]
debug = 1
